name: MeloCore
version: '${version}'

main: net.kihashix.meloCore.MeloCore
api-version: '1.21.11'
load: POSTWORLD

commands:
  mc:
    description: Lenh chinh cua MeloCore (quan ly skill, items, kiem tra update)
    usage: /mc <skills|items|update> ...

permissions:
  melocore.admin.skills:
    description: Quan ly skill (give/remove/cooldown/toggle)
    default: op
  melocore.admin.items:
    description: Quan ly items (give/list)
    default: op
  melocore.admin.debug:
    description: Bat/tat debug va nhan thong bao debug
    default: op
  melocore.admin.update:
    description: Kiem tra va tai ban update tu GitHub Releases
    default: op
